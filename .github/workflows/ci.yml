name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DCSPanelManager.sln

      - name: Build Release
        run: dotnet build DCSPanelManager.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DCSPanelManager.sln --configuration Release --no-build --no-restore
